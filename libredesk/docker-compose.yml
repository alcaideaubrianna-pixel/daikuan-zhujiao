services:
  app:
    image: libredesk/libredesk:latest
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      LIBREDESK_SYSTEM_USER_PASSWORD: ${LIBREDESK_SYSTEM_USER_PASSWORD:-change-me-now}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - libredesk_uploads:/libredesk/uploads
      - ./config.toml:/libredesk/config.toml:ro
    command: ["sh", "-c", "./libredesk --install --idempotent-install --yes --config /libredesk/config.toml && ./libredesk --upgrade --yes --config /libredesk/config.toml && ./libredesk --config /libredesk/config.toml"]
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: libredesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-libredesk}
      POSTGRES_DB: libredesk
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U libredesk -d libredesk"]
      interval: 10s
      timeout: 5s
      retries: 6
    volumes:
      - libredesk_postgres:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - libredesk_redis:/data
volumes:
  libredesk_uploads:
  libredesk_postgres:
  libredesk_redis:
