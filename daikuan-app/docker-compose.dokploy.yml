name: kuaidai

services:
  midway:
    image: ghcr.io/alcaideaubrianna-pixel/kuaidai-midway:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TZ: Asia/Shanghai
      DATABASE_TYPE: sqlite
      DB_SQLITE_PATH: /home/node/.cool-admin/cool.sqlite
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE:-true}
      COOL_INIT_DB: ${COOL_INIT_DB:-true}
      COOL_INIT_MENU: ${COOL_INIT_MENU:-true}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8001}
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
      COS_BUCKET: ${COS_BUCKET:-}
      COS_REGION: ${COS_REGION:-ap-guangzhou}
      COS_DOMAIN: ${COS_DOMAIN:-}
    volumes:
      - kuaidai_data:/home/node/.cool-admin
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8001/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  h5:
    image: ghcr.io/alcaideaubrianna-pixel/kuaidai-h5:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      midway:
        condition: service_healthy
    expose:
      - "80"

  admin:
    image: ghcr.io/alcaideaubrianna-pixel/kuaidai-admin:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      midway:
        condition: service_healthy
    expose:
      - "80"

volumes:
  kuaidai_data:
