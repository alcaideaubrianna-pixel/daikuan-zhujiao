name: Build container images

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "daikuan-app/**"
      - ".github/workflows/build-images.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: container-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: midway
            context: ./daikuan-app
            dockerfile: ./daikuan-app/Dockerfile
            image: kuaidai-midway
          - service: h5
            context: ./daikuan-app/web/h5
            dockerfile: ./daikuan-app/web/h5/Dockerfile
            image: kuaidai-h5
          - service: admin
            context: ./daikuan-app/web/admin
            dockerfile: ./daikuan-app/web/admin/Dockerfile
            image: kuaidai-admin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
